<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Юный Эколог</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #bfe6f5;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #loading {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #2f7d4a; color: #fff; text-align: center; padding: 24px;
  }
  #loading h1 { font-size: 40px; margin: 0 0 16px; }
  #loading p  { font-size: 24px; margin: 0; }
  #loading.error { background: #a33; }

  #hint {
    position: fixed; left: 0; right: 0; z-index: 5; pointer-events: none;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center; color: #fff; font-size: 22px; font-weight: 600;
    text-shadow: 0 2px 6px rgba(0,0,0,.55);
    transition: opacity .8s;
  }
  #debug {
    position: fixed; z-index: 5; pointer-events: none;
    top: calc(8px + env(safe-area-inset-top, 0px)); left: 10px;
    color: #fff; font-size: 16px; font-family: ui-monospace, Menlo, monospace;
    text-shadow: 0 1px 4px rgba(0,0,0,.7); white-space: pre;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="debug"></div>
<div id="hint">Свайп влево/вправо<br>или касание левой/правой половины</div>
<div id="loading"><h1>Юный Эколог</h1><p id="loadingText">Загрузка…</p></div>
<script src="game.js"></script>
</body>
</html>
